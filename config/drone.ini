[base]
env_name = drone

[vec]
total_agents = 2048
num_buffers = 8
num_threads = 1

[env]
task = 1
num_drones = 64
max_rings = 10
# Stirling velocity-setpoint stack. Inert at these values — the default run is
# HOVER on the native motor path, unchanged. They are here so the CLI generates
# --env.control-mode / --env.k-res: pufferl builds one flag per ini key, so a
# key that is absent cannot be overridden at all.
# FORMATION runs (Stage 3a floor):
#   --env.task 2 --env.num-drones 4 --env.control-mode 1
# num_drones must be <= 4 for FORMATION (one formation per env; c_reset errors
# otherwise). Throughput comes from vec.total_agents, not from packing drones
# into an env.
control_mode = 0
k_res = 0.0
# Task (e) reward extension. Inert at these values — alpha_jerk/alpha_align are
# 0 and separation_floor = 0 skips the O(n^2) check entirely — so the default
# HOVER run is bit-identical to Stage 1 in reward, behaviour and cost (asserted
# by the [reward inert] gate in stirling/tests/).
#
# FORMATION runs opt in, e.g. --env.separation-floor 0.4 (FR-15). The two
# weights are deliberately left at 0 rather than guessed: both terms are
# latent under pure classical control (measured: jerk |dv_cmd| = 0.0048 m/s,
# and tracking error 0.07 m never leaves align_dist, so the timer never runs),
# so no defensible size exists until the residual is in the loop. Size them in
# the Stage 3b sweep against the measured scale — the dominant reward term is
# alpha_hover*potential at ~0.047/tick.
alpha_jerk = 0.0
alpha_align = 0.0
align_dist = 0.15
align_time = 2.0
separation_floor = 0.0
separation_terminates = 0
alpha_dist = 0.782192
alpha_hover = 0.071445
alpha_omega = 0.00135588
alpha_shaping = 3.9754
hover_target_dist = 5
hover_dist = 0.1
hover_omega = 0.1
hover_vel = 0.1

[policy]
hidden_size = 128
num_layers = 3.80354
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 40000000
learning_rate = 0.00975033
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.981094
gae_lambda = 0.883828
replay_ratio = 2.25498
clip_coef = 0.067834
vf_coef = 4.42222
vf_clip_coef = 3.42278
max_grad_norm = 0.692201
ent_coef = 9.62597e-05
beta1 = 0.914207
beta2 = 0.99988
eps = 1e-14
minibatch_size = 8192
horizon = 32
vtrace_rho_clip = 3.32822
vtrace_c_clip = 4.37219
prio_alpha = 0.427293
prio_beta0 = 1

[sweep.train.total_timesteps]
distribution = log_normal
min = 4e7
max = 3e8
mean = 1e8
scale = auto

[sweep.env.alpha_dist]
distribution = log_normal
min = 0.1
max = 100.0
mean = 1.0
scale = auto

[sweep.env.alpha_omega]
distribution = log_normal
min = 0.0001
max = 1.0
mean = 0.001
scale = auto

[sweep.env.alpha_hover]
distribution = log_normal
min = 0.001
max = 1.0
mean = 0.01
scale = auto

[sweep.env.alpha_shaping]
distribution = log_normal
min = 0.01
max = 10.0
mean = 1.0
scale = auto
